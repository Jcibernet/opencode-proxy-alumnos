# Configuracion de CLIProxyAPI para alumnos.
# Copia este archivo a config.yaml (lo hace setup.sh automaticamente).
#
# Uso local con login web (OAuth). No pegues API keys: las credenciales se
# guardan despues del login en auth-dir (~/.cli-proxy-api).

# Puerto local del proxy. opencode y droid apuntan a este puerto.
port: 8317

# Seguridad: no habilitamos administracion remota.
remote-management:
  allow-remote: false

# Sin clave de administracion por defecto.
secret-key: ""

# Carpeta local donde se guardan tus tokens OAuth.
# IMPORTANTE: nunca compartas ni subas esta carpeta.
auth-dir: "~/.cli-proxy-api"

# Mantiene el mismo patron que la configuracion usada en clase.
auth:
  providers: []

# Pon true solo si necesitas depurar errores.
debug: false
